name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality, tests, security & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest

      - name: Bandit
        run: bandit -q -r src

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Pipeline smoke test
        run: |
          python -m src.pipeline --output-dir artifacts
          test -s artifacts/raw_data.csv
          test -s artifacts/processed_data.csv
          test -s artifacts/sales_plot.png

      - name: Build Docker image
        run: docker build -t data-pipeline-ci-cd .

      - name: Run Docker image
        run: docker run --rm data-pipeline-ci-cd
